<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Recipe App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Recipe App</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
